backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "domains"
    label: "Domains"
    folder: "public/content/domains"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Domain Name", name: "title", widget: "string"}
      - {label: "Status", name: "status", widget: "select", options: ["Available", "Offers Under Review", "Sold", "Hidden"], default: "Available"}
      - {label: "Price", name: "price", widget: "string", required: false}
      - {label: "Description", name: "description", widget: "markdown"}

  - name: "blog"
    label: "Blog"
    folder: "public/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Author", name: "author", widget: "string", default: "Namelyx Team"}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About Page"
        file: "public/content/pages/about.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - name: "contact"
        label: "Contact Page"
        file: "public/content/pages/contact.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "string"}

  - name: "settings"
    label: "Settings"
    files:
      - name: "seo"
        label: "General SEO"
        file: "public/content/settings/seo.json"
        fields:
          - {label: "Site Title", name: "site_title", widget: "string"}
          - {label: "Site Description", name: "site_description", widget: "text"}
          - {label: "Keywords", name: "site_keywords", widget: "string"}
      - name: "scripts"
        label: "Scripts & Analytics"
        file: "public/content/settings/scripts.json"
        fields:
          - {label: "Google Search Console Meta Tag", name: "google_console", widget: "string", required: false}
          - {label: "Google Analytics ID (G-XXXX)", name: "google_analytics", widget: "string", required: false}
          - {label: "AdSense Script", name: "google_adsense", widget: "code", required: false}
